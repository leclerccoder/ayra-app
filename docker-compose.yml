services:
  db:
    image: postgres:16-alpine
    container_name: ayra_local_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayra
      POSTGRES_PASSWORD: ayra_password
      POSTGRES_DB: ayra_local
    ports:
      - "5433:5432"
    volumes:
      - ayra_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayra -d ayra_local"]
      interval: 5s
      timeout: 5s
      retries: 10
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: ayra_local_anvil
    user: "0:0"
    entrypoint: ["anvil"]
    command:
      [
        "--chain-id",
        "31337",
        "--host",
        "0.0.0.0",
        "--port",
        "8545",
        "--mnemonic",
        "test test test test test test test test test test test junk",
        "--state",
        "/anvil/state.json",
        "--state-interval",
        "2",
      ]
    ports:
      - "8545:8545"
    volumes:
      - anvil_state:/anvil
    restart: unless-stopped

volumes:
  ayra_db:
  anvil_state:
